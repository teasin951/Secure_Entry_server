services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/logs:/mosquitto/logs
      - ./certs/mosquitto:/mosquitto/certs
    networks:
      - eleados_network
    
  postgres:
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin   # CHANGE THIS!!!
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./postgresql/sql:/etc/eleados
    networks:
      - eleados_network

  event_service:
    container_name: event_service
    restart: unless-stopped
    build:
      context: ./event_service
      dockerfile: ./Dockerfile

    environment:
      MOSQUITTO_HOSTNAME: mosquitto_hostname   #CHANGE THIS!!! (must match mosquito's cert)
      MOSQUITTO_PORT: 8883
      MOSQUITTO_DYNSEC_USERNAME: admin
      MOSQUITTO_DYNSEC_PASSWORD: admin    # CHANGE THIS!!!

      SERVICE_MQTT_USERNAME: EventService
      SERVICE_MQTT_PASSWORD: admin        # CHANGE THIS!!!

      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: Eleados
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin   #CHANG THIS!!! (should match with postgres password)

    volumes:
      - ./event_service/logs:/var/log/eleados
      - ./certs/event_service:/srv/eleados/certs:ro
    networks:
      - eleados_network

networks: 
  eleados_network:
    driver: bridge
